name: Kover Coverage Report
description: Parse per-module Kover XML reports, build a summary table, post/update a PR comment, and upload HTML/XML artifacts.

inputs:
  reports-glob:
    description: Glob matching per-module Kover XML reports.
    required: false
    default: "**/build/reports/kover/report.xml"
  root-xml:
    description: Path to the root aggregated Kover XML report.
    required: false
    default: build/reports/kover/report.xml
  html-path:
    description: Path to the root aggregated Kover HTML report directory.
    required: false
    default: build/reports/kover/html
  artifact-retention-days:
    description: Retention in days for uploaded HTML and XML artifacts.
    required: false
    default: "14"
  github-token:
    description: Token with pull-requests:write used to post/update the PR comment. Leave empty to skip commenting.
    required: false
    default: ""
  baseline-dir:
    description: Directory containing baseline coverage XMLs for delta comparison. Leave empty when no baseline is available.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Render coverage summary
      shell: bash
      env:
        REPORTS_GLOB: ${{ inputs.reports-glob }}
        ROOT_XML: ${{ inputs.root-xml }}
        BASELINE_DIR: ${{ inputs.baseline-dir }}
      run: python3 "$GITHUB_ACTION_PATH/scripts/render-markdown.py"

    - name: Upsert coverage comment on PR
      if: github.event_name == 'pull_request' && inputs.github-token != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: bash "$GITHUB_ACTION_PATH/scripts/upsert-pr-comment.sh"

    - name: Upload Kover HTML report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: kover-html-report
        path: ${{ inputs.html-path }}
        retention-days: ${{ inputs.artifact-retention-days }}

    - name: Upload Kover XML report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: kover-xml-report
        path: ${{ inputs.root-xml }}
        retention-days: ${{ inputs.artifact-retention-days }}
