name: Automerge

# check_suite would be the natural completion signal, but GitHub does not
# emit it for suites created by Actions itself, so the merge would never
# fire. workflow_run is delivered as expected (see the pascalgn README).
on:
  pull_request:
    types:
      - labeled
      - unlabeled
      - opened
      - edited
      - reopened
      - synchronize
  workflow_run:
    workflows:
      - PR Check
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: Automerge pull request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # MERGE_METHOD must stay "merge": rebase and squash rewrite commit
      # SHAs, so the next forward merge no longer sees the branches as
      # related and the same conflicts come back on every hop.
      #
      # MERGE_READY_STATE must stay "clean": we have no required status
      # checks, so while PR Check is still running GitHub reports the PR
      # as "unstable" and anything broader would merge it before the
      # checks finish. The workflow_run trigger retries once they complete.
      #
      # The retries bridge the window right after PR Check finishes, when
      # GitHub is still recomputing the PR state and briefly reports it
      # as "unstable".
      - name: Automerge pull request
        uses: pascalgn/automerge-action@v0.16.4
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          MERGE_LABELS: automerge
          MERGE_METHOD: merge
          MERGE_DELETE_BRANCH: true
          MERGE_READY_STATE: clean
          MERGE_RETRIES: 6
          MERGE_RETRY_SLEEP: 10000
