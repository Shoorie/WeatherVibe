name: PR Check

on:
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-android

      - run: ./gradlew assembleDebug
      - run: ./gradlew lint
      - run: ./gradlew detekt
      - run: ./gradlew test
      - run: ./gradlew koverXmlReport koverHtmlReport

      - name: Post coverage to PR
        id: kover
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.7.2
        with:
          paths: ${{ github.workspace }}/build/reports/kover/report.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 0
          min-coverage-changed-files: 0
          title: ":bar_chart: Code Coverage"
          update-comment: true
          pass-emoji: ":green_circle:"
          fail-emoji: ":red_circle:"

      - name: Write coverage to job summary
        if: always() && github.event_name == 'pull_request'
        run: |
          {
            echo "## :bar_chart: Code Coverage"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Overall | ${{ steps.kover.outputs.coverage-overall }}% |"
            echo "| Changed files | ${{ steps.kover.outputs.coverage-changed-files }}% |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Kover HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kover-html-report
          path: build/reports/kover/html
          retention-days: 14

      - name: Upload Kover XML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kover-xml-report
          path: build/reports/kover/report.xml
          retention-days: 14
