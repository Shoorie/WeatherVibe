name: PR Check

on:
  pull_request:
    branches: [ main, develop, release/* ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

jobs:
  build:
    name: assembleDebug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-android
      - run: ./gradlew assembleDebug

  detekt:
    name: detekt
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-android
      - run: ./gradlew detekt

      - name: Upload detekt SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: build/reports/detekt/merged.sarif
          category: detekt

  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-android
      - run: ./gradlew :app:lint

      - name: Upload lint SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: app/build/reports/lint-results-debug.sarif
          category: android-lint

  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-android
      - run: ./gradlew test koverXmlReport

      - name: Restore coverage baseline
        if: always()
        uses: actions/cache/restore@v4
        with:
          path: .kover-baseline
          key: kover-baseline-${{ github.base_ref }}-no-exact-match
          restore-keys: |
            kover-baseline-${{ github.base_ref }}-

      - name: Report coverage
        if: always()
        uses: ./.github/actions/kover-report
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          baseline-dir: .kover-baseline
