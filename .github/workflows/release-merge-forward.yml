name: Release Merge Forward

on:
  workflow_dispatch:
    inputs:
      target-branch:
        description: >-
          Target branch; empty picks the next release branch (an epic or
          master source requires this)
        required: false
        type: string
      automerge:
        description: >-
          Merge the created PR automatically once checks pass. Does not
          apply when conflicts stop the merge before a PR exists (Slack
          will tell you) or while checks stay red
        required: false
        type: boolean
        default: true

concurrency:
  group: release-merge-forward-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  JIRA_BASE_URL: https://jira.empik.com/browse
  SOURCE_BRANCH: ${{ github.ref_name }}

jobs:
  merge-forward:
    name: Merge release forward
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Resolve target branch
        id: target
        env:
          TARGET_OVERRIDE: ${{ inputs.target-branch }}
        run: bash ./scripts/ci/merge-release/resolve-target.sh

      - name: Merge source into merge branch
        id: merge
        if: steps.target.outputs.skip == 'false'
        env:
          TARGET_BRANCH: ${{ steps.target.outputs.target-branch }}
          MERGE_BRANCH: ${{ steps.target.outputs.merge-branch }}
        run: bash ./scripts/ci/merge-release/perform-merge.sh

      - name: Open merge pull request
        if: steps.merge.outputs.status == 'merged'
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          TARGET_BRANCH: ${{ steps.target.outputs.target-branch }}
          MERGE_BRANCH: ${{ steps.target.outputs.merge-branch }}
          AUTOMERGE: ${{ inputs.automerge }}
          AUTO_RESOLVED: ${{ steps.merge.outputs.auto-resolved }}
        run: bash ./scripts/ci/merge-release/open-pull-request.sh

      - name: Resolve Slack mention for the workflow actor
        id: mention
        if: steps.merge.outputs.status == 'conflict'
        continue-on-error: true
        env:
          PR_AUTHOR: ${{ github.actor }}
        run: bash ./scripts/ci/notify-review/resolve-mention.sh

      - name: Build conflict notification
        if: steps.merge.outputs.status == 'conflict'
        env:
          TARGET_BRANCH: ${{ steps.target.outputs.target-branch }}
          MERGE_BRANCH: ${{ steps.target.outputs.merge-branch }}
          CONFLICT_FILES: ${{ steps.merge.outputs.conflict-files }}
          MENTION: ${{ steps.mention.outputs.value }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash ./scripts/ci/merge-release/build-conflict-notification.sh

      - name: Notify Slack about conflicts
        if: steps.merge.outputs.status == 'conflict'
        uses: slackapi/slack-github-action@v3
        with:
          webhook: ${{ secrets.SLACK_REVIEW_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload-file-path: conflict-notification.json
