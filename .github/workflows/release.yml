name: Release

on:
  push:
    tags: [ 'v*' ]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Distribute
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-android

      - name: Extract version from tag
        id: version
        run: echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        run: ./scripts/generate-release-notes.sh

      - uses: ./.github/actions/decode-keystore
        id: keystore
        with:
          keystore-base64: ${{ secrets.KEYSTORE_BASE64 }}

      - uses: ./.github/actions/setup-firebase
        id: firebase
        with:
          service-account-json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Inject AdMob IDs
        env:
          ADMOB_IDS_XML: ${{ secrets.ADMOB_IDS_XML }}
        run: |
          mkdir -p app/src/release/res/values
          printf '%s' "$ADMOB_IDS_XML" > app/src/release/res/values/admob_ids.xml

      - name: Build release APK and AAB
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          KEYSTORE_PATH: ${{ steps.keystore.outputs.keystore-path }}
        run: ./gradlew assembleRelease bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ steps.version.outputs.name }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.txt
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab

      - name: Distribute to Firebase
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          KEYSTORE_PATH: ${{ steps.keystore.outputs.keystore-path }}
          FIREBASE_SERVICE_ACCOUNT_FILE: ${{ steps.firebase.outputs.credentials-path }}
        run: ./gradlew appDistributionUploadRelease

      - name: Publish to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.weather.vibe
          releaseFiles: app/build/outputs/bundle/release/*.aab
          whatsNewDirectory: distribution/whatsnew
          tracks: internal
          status: completed
