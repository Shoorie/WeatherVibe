syntax = "proto3";

option java_package = "com.weather.vibe.data.settings.persistence";
option java_multiple_files = true;

message UserSettingsCacheData {
  string ai_persona = 1;
  string excluded_genres = 2;
  string temperature_unit = 3;
  string default_city = 4;
  bool weather_alerts_enabled = 5;
  bool morning_brief_enabled = 6;
  bool welcome_onboarding_seen = 7;
  bool pollen_alerts_enabled = 8;
  bool mood_reminder_enabled = 9;
  bool widget_promo_eligible = 10;
  bool widget_promo_seen = 11;
}
