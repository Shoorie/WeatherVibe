syntax = "proto3";

option java_package = "com.weather.vibe.data.weather.persistence";
option java_multiple_files = true;

message WeatherAiCacheData {
  string city_name = 1;
  string date = 2;
  string briefing_text = 3;
  string mood = 4;
  string genres_csv = 5;
  string persona = 6;
  string excluded_genres = 7;
}
