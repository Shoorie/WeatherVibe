syntax = "proto3";

option java_package = "com.weather.vibe.data.widget.persistence";
option java_multiple_files = true;

message WidgetSnapshotCacheData {
  WidgetSnapshotEntry snapshot = 1;
}

message WidgetSnapshotEntry {
  WidgetLocationEntry location = 1;
  string condition_name = 2;
  double current_temperature = 3;
  int64 fetched_at_epoch_millis = 4;
  string mood = 5;
}

message WidgetLocationEntry {
  int64 id = 1;
  string name = 2;
  string admin1 = 3;
  string country = 4;
  double latitude = 5;
  double longitude = 6;
}
