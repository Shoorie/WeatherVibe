<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8"/>
<title>Vibe Rating — WeatherVibe</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; font-family: 'Manrope', system-ui, sans-serif; background: #F1F5F9; color: #0F172A; }
  .wv-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
  .wv-scroll::-webkit-scrollbar-track { background: transparent; }
  .wv-scroll::-webkit-scrollbar-thumb { background: rgba(100,116,139,.25); border-radius: 2px; }
  .wv-btn:active { transform: scale(.98); }
  @keyframes wvFade { from { opacity: 0; transform: translateY(4px);} to { opacity: 1; transform: translateY(0); } }
  @keyframes toastIn { from { opacity: 0; transform: translateY(8px);} to { opacity: 1; transform: translateY(0); } }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="primitives.jsx"></script>
  <script type="text/babel" src="shell.jsx"></script>
  <script type="text/babel" src="places-variants.jsx"></script>
  <script type="text/babel" src="vibe-rating-variants.jsx"></script>
  <script type="text/babel" src="vibe-history-screen.jsx"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const TWEAKS = /*EDITMODE-BEGIN*/{
      "lang": "pl",
      "which": "all",
      "showHistory": true,
      "showProfile": true,
      "rated": true
    }/*EDITMODE-END*/;

    // ───────────────────────────────────────────────────────────
    // Home — Hero + Vibe blurb + Rating card (wariant)
    // ───────────────────────────────────────────────────────────
    function HomeWithVibe({ lang, VariantCard, initialRating }) {
      return (
        <PhoneShell statusDark={false} statusTime="15:11" bg="#FAFBFF">
          <div className="wv-scroll" style={{
            position: 'absolute', inset: 0, overflowY: 'auto', zIndex: 5, paddingBottom: 120,
          }} data-screen-label="Home + Vibe Rating">

            {/* Hero */}
            <div style={{ padding: '60px 16px 0' }}>
              <div style={{
                borderRadius: 22, padding: '18px 18px 16px',
                background: 'linear-gradient(160deg, #4F46E5 0%, #6366F1 60%, #818CF8 100%)',
                color: '#fff', position: 'relative', overflow: 'hidden',
              }}>
                <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                  <div>
                    <div style={{ font: '600 26px/30px Manrope', letterSpacing: '-.4px' }}>Toruń</div>
                    <div style={{ font: '400 12px/16px Manrope', opacity: .85, marginTop: 2 }}>
                      {lang === 'pl' ? 'piątek, 24 kwietnia' : 'Friday, Apr 24'}
                    </div>
                  </div>
                </div>
                <div style={{ display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between', marginTop: 10 }}>
                  <div>
                    <div style={{ font: '200 64px/64px Manrope', letterSpacing: '-2.5px' }}>18°</div>
                    <div style={{ font: '400 12px/16px Manrope', opacity: .85, marginTop: 4 }}>
                      {lang === 'pl' ? 'Odczuwalna' : 'Feels like'} 15°
                    </div>
                    <div style={{ font: '600 14px/20px Manrope', marginTop: 2 }}>
                      {lang === 'pl' ? 'Częściowe zachmurzenie' : 'Partly cloudy'}
                    </div>
                  </div>
                  <div style={{ fontSize: 56, marginBottom: 6 }}>⛅</div>
                </div>
              </div>
            </div>

            {/* Vibe blurb (sam AI vibe) */}
            <div style={{ padding: '18px 16px 0' }}>
              <VibeBlurb lang={lang}/>
            </div>

            {/* Rating card (wariant) */}
            <div style={{ padding: '18px 16px 0' }}>
              <VariantCard lang={lang} initialRating={initialRating} onSeeHistory={() => {}}/>
            </div>
          </div>
          <BottomNav active="home" onTab={() => {}} dark={false} tint="#4F46E5"/>
        </PhoneShell>
      );
    }

    // ───────────────────────────────────────────────────────────
    // "Twój vibe" phone (history screen)
    // ───────────────────────────────────────────────────────────
    function HistoryPhone({ lang }) {
      return (
        <PhoneShell statusDark={false} statusTime="15:11" bg="#FAFBFF">
          <div className="wv-scroll" style={{
            position: 'absolute', inset: 0, overflowY: 'auto', zIndex: 5,
          }} data-screen-label="Twój vibe · kalendarz">
            <VibeHistoryScreen lang={lang}/>
          </div>
          <BottomNav active="profile" onTab={() => {}} dark={false} tint="#4F46E5"/>
        </PhoneShell>
      );
    }

    // ───────────────────────────────────────────────────────────
    // Profile — pokazuje gdzie "Twój vibe" się wpina
    // ───────────────────────────────────────────────────────────
    function ProfilePhone({ lang }) {
      const T = VIBE_COPY[lang];
      return (
        <PhoneShell statusDark={false} statusTime="15:11" bg="#FAFBFF">
          <div className="wv-scroll" style={{
            position: 'absolute', inset: 0, overflowY: 'auto', zIndex: 5, paddingBottom: 120,
          }} data-screen-label="Profil (z wpięciem Twój vibe)">
            <ProfileScreen lang={lang}/>
          </div>
          <BottomNav active="profile" onTab={() => {}} dark={false} tint="#4F46E5"/>
        </PhoneShell>
      );
    }

    function ProfileScreen({ lang }) {
      const T = VIBE_COPY[lang];
      const Row = ({ icon, label, value, accent, highlight, onClick, last }) => (
        <button onClick={onClick} style={{
          width: '100%', display: 'flex', alignItems: 'center', gap: 12,
          padding: '14px 16px', background: 'transparent',
          border: 0, borderBottom: last ? 0 : '1px solid #F1F5F9',
          cursor: 'pointer', textAlign: 'left',
        }}>
          <div style={{
            width: 36, height: 36, borderRadius: 10,
            background: highlight ? '#EEF2FF' : '#F8FAFC',
            color: highlight ? '#4F46E5' : '#64748B',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            flexShrink: 0,
          }}>{icon}</div>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{
              font: `${highlight ? 600 : 500} 14px/18px Manrope`,
              color: highlight ? '#4F46E5' : '#0F172A',
            }}>{label}</div>
            {value && (
              <div style={{ font: '400 12px/16px Manrope', color: '#94A3B8', marginTop: 2 }}>
                {value}
              </div>
            )}
          </div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#CBD5E1" strokeWidth="2" strokeLinecap="round">
            <path d="M9 6 L15 12 L9 18"/>
          </svg>
        </button>
      );

      const Section = ({ label, children }) => (
        <div style={{ marginTop: 24 }}>
          <div style={{
            padding: '0 22px 8px',
            font: '500 10px/14px Manrope', letterSpacing: '1.4px',
            textTransform: 'uppercase', color: '#94A3B8',
          }}>{label}</div>
          <div style={{
            margin: '0 16px', background: '#fff', borderRadius: 16,
            boxShadow: '0 1px 2px rgba(15,23,42,.04)',
            overflow: 'hidden',
          }}>
            {children}
          </div>
        </div>
      );

      return (
        <>
          {/* Header z awatarem */}
          <div style={{ padding: '68px 22px 0' }}>
            <div style={{
              font: '700 26px/30px Manrope', letterSpacing: '-.4px', color: '#0F172A',
            }}>{T.profileTitle}</div>
            <div style={{
              marginTop: 18, display: 'flex', alignItems: 'center', gap: 14,
              padding: '14px 16px', borderRadius: 18, background: '#fff',
              boxShadow: '0 1px 2px rgba(15,23,42,.04)',
            }}>
              <div style={{
                width: 54, height: 54, borderRadius: '50%',
                background: 'linear-gradient(135deg, #818CF8 0%, #4F46E5 100%)',
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                font: '600 20px/1 Manrope', color: '#fff',
              }}>K</div>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ font: '600 16px/22px Manrope', color: '#0F172A' }}>
                  {T.profileGreeting}
                </div>
                <div style={{ font: '400 12px/16px Manrope', color: '#64748B', marginTop: 2 }}>
                  {T.profileSub}
                </div>
              </div>
            </div>
          </div>

          {/* Your vibe — highlighted section */}
          <Section label={T.profileSectionVibe}>
            <Row
              icon={<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
                <rect x="3" y="4" width="18" height="18" rx="3"/>
                <path d="M3 10 h18 M8 2 v4 M16 2 v4"/>
              </svg>}
              label={T.profileYourVibe}
              value={T.profileYourVibeSub}
              highlight={true}
              last={true}
            />
          </Section>

          {/* Account */}
          <Section label={T.profileSectionAcc}>
            <Row
              icon={<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
                <rect x="3" y="5" width="18" height="14" rx="2"/>
                <path d="M3 7 l9 6 l9 -6"/>
              </svg>}
              label={T.profileEmail}
              value="klaudiusz@gmail.com"
            />
            <Row
              icon={<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
                <path d="M12 2 L15 9 L22 9 L16 14 L18 21 L12 17 L6 21 L8 14 L2 9 L9 9 Z"/>
              </svg>}
              label={T.profileSub2}
              value={T.profilePlan}
              last={true}
            />
          </Section>

          {/* Preferencje */}
          <Section label={T.profileSectionPref}>
            <Row
              icon={<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
                <circle cx="12" cy="12" r="4"/><path d="M12 2 v2 M12 20 v2 M4 12 h2 M18 12 h2 M5.6 5.6 l1.4 1.4 M17 17 l1.4 1.4 M5.6 18.4 l1.4 -1.4 M17 7 l1.4 -1.4"/>
              </svg>}
              label={T.profileUnits}
              value={T.profileUnitsVal}
            />
            <Row
              icon={<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
                <path d="M6 8 a6 6 0 0 1 12 0 c0 7 3 9 3 9 H3 s3 -2 3 -9"/><path d="M10 21 a2 2 0 0 0 4 0"/>
              </svg>}
              label={T.profileNotif}
              value={T.profileNotifVal}
            />
            <Row
              icon={<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
                <circle cx="12" cy="12" r="10"/><path d="M2 12 h20 M12 2 a15 15 0 0 1 0 20 M12 2 a15 15 0 0 0 0 20"/>
              </svg>}
              label={T.profileLang}
              value={T.profileLangVal}
              last={true}
            />
          </Section>

          {/* App */}
          <Section label={T.profileSectionApp}>
            <Row
              icon={<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
                <circle cx="12" cy="12" r="10"/><path d="M9.1 9 a3 3 0 0 1 5.8 1 c0 2 -3 2.5 -3 4 M12 17 v.5"/>
              </svg>}
              label={T.profileHelp}
            />
            <Row
              icon={<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
                <path d="M12 2 L4 6 v6 c0 5 3.5 9 8 10 c4.5 -1 8 -5 8 -10 V6 Z"/>
              </svg>}
              label={T.profilePrivacy}
            />
            <Row
              icon={<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
                <circle cx="12" cy="12" r="10"/><path d="M12 8 v.5 M12 12 v4"/>
              </svg>}
              label={T.profileAbout}
              last={true}
            />
          </Section>

          <button style={{
            margin: '24px 16px 8px', width: 'calc(100% - 32px)',
            padding: '12px', borderRadius: 12, border: 0, cursor: 'pointer',
            background: '#fff', color: '#DC2626',
            font: '600 13px/18px Manrope',
            boxShadow: '0 1px 2px rgba(15,23,42,.04)',
          }}>{T.profileLogout}</button>

          <div style={{
            textAlign: 'center', padding: '8px 0 0',
            font: '400 11px/14px Manrope', color: '#CBD5E1',
          }}>{T.profileVersion}</div>
        </>
      );
    }

    // ───────────────────────────────────────────────────────────
    // Root
    // ───────────────────────────────────────────────────────────
    function Root() {
      const [tweaks, setTweaks] = useState(TWEAKS);

      useEffect(() => {
        window.parent.postMessage({ type: '__edit_mode_available' }, '*');
      }, []);

      const update = (k, v) => {
        const next = { ...tweaks, [k]: v };
        setTweaks(next);
        window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [k]: v } }, '*');
      };

      const variants = [
        {
          id: 'v1', title: 'V1 · Thumbs',
          sub: 'Najniższa frykcja — 👍/🤷/👎. Mapowane na 5/3/1.',
          note: 'Najszybsze do klikniecia. Dwa stany: "oceń" i "po ocenie" (z share poster + CTA do Twój vibe). Dobre na start gdy chcesz dużego pokrycia.',
          Variant: V1_Thumbs,
        },
        {
          id: 'v2', title: 'V2 · Faces 5',
          sub: 'Pięć buziek — granularny sygnał 1-5.',
          note: 'Bardziej precyzyjny sygnał bez ciężaru slidera. Buzie są przyjemne, taktylne. Po ocenie identyczny blok akcji (share + Twój vibe).',
          Variant: V2_Faces,
        },
        {
          id: 'v3', title: 'V3 · Slider 1-5',
          sub: 'Ciągły slider z nazwami pod tickami.',
          note: 'Dwukrokowy (ustaw + zapisz). Najbardziej "celowy" — wymaga zaangażowania, ale daje użytkownikowi kontrolę i pokazuje podgląd "ocena dziś: Dobry" zanim potwierdzi.',
          Variant: V3_SliderContext,
        },
      ];
      const shown = tweaks.which === 'all' ? variants : variants.filter(v => v.id === tweaks.which);
      const initialRating = tweaks.rated ? 4 : null;

      return (
        <>
          <DesignCanvas
            title="WeatherVibe · Vibe Rating"
            subtitle="Ocena dnia na Home (3 warianty) → Twój vibe w kalendarzu → wpięcie w Profilu. Każda ocena dostaje snapshot pogody; historia buduje się z czasem (forward-only)."
          >
            <DCSection id="cards" title="Karta oceny dnia (Home)">
              {shown.map(v => (
                <DCArtboard key={v.id} id={`phone-${v.id}`} label={v.title} width={410} height={900}>
                  <div style={{
                    display: 'flex', justifyContent: 'center', alignItems: 'center',
                    width: '100%', height: '100%', background: '#F1F5F9',
                  }}>
                    <HomeWithVibe lang={tweaks.lang} VariantCard={v.Variant} initialRating={initialRating}/>
                  </div>
                </DCArtboard>
              ))}
            </DCSection>

            {tweaks.showHistory && (
              <DCSection id="history" title="Ekran 'Twój vibe' (kalendarz + ulubiona pogoda)">
                <DCArtboard id="phone-history" label="Twój vibe · kalendarz nawigowalny" width={410} height={900}>
                  <div style={{
                    display: 'flex', justifyContent: 'center', alignItems: 'center',
                    width: '100%', height: '100%', background: '#F1F5F9',
                  }}>
                    <HistoryPhone lang={tweaks.lang}/>
                  </div>
                </DCArtboard>
              </DCSection>
            )}

            {tweaks.showProfile && (
              <DCSection id="profile" title="Gdzie to jest w Profilu">
                <DCArtboard id="phone-profile" label="Profil · sekcja 'Twój vibe' na górze" width={410} height={900}>
                  <div style={{
                    display: 'flex', justifyContent: 'center', alignItems: 'center',
                    width: '100%', height: '100%', background: '#F1F5F9',
                  }}>
                    <ProfilePhone lang={tweaks.lang}/>
                  </div>
                </DCArtboard>
              </DCSection>
            )}

            <DCSection id="how" title="Jak to działa (data flow)">
              <DCArtboard id="how-card" label="Snapshot pogody zamrożony w momencie oceny" width={1240} height={620}>
                <div style={{ padding: '32px 40px', background: '#fff', height: '100%', overflow: 'auto' }}>
                  <div style={{ font: '700 24px/30px Manrope', letterSpacing: '-.4px', marginBottom: 6 }}>
                    Nie potrzebujesz historycznej pogody
                  </div>
                  <div style={{ font: '400 14px/22px Manrope', color: '#475569', marginBottom: 22, maxWidth: 900 }}>
                    Ocenę robimy w momencie kiedy user jest na karcie. Bierzemy <strong>aktualny snapshot pogody</strong> (to co już pobraliśmy z API dla Home) i zapisujemy go razem z oceną jako jeden obiekt w bazie. To rekord niezmienny — „zdjęcie" dnia: temperatura, warunek, wilgotność, ciśnienie, wiatr, jakość powietrza. Jutro pogoda się zmieni, ale ta ocena dalej wie, że była 18°C i częściowe zachmurzenie.
                  </div>

                  {/* Diagram przepływu */}
                  <div style={{
                    display: 'grid', gridTemplateColumns: '1fr auto 1fr auto 1fr', gap: 12,
                    alignItems: 'stretch', marginBottom: 20,
                  }}>
                    {/* 1. User rates */}
                    <div style={{
                      padding: 16, borderRadius: 12, background: '#F8FAFC',
                      border: '1px solid #E2E8F0',
                    }}>
                      <div style={{ font: '600 10px/14px Manrope', letterSpacing: '1px', color: '#94A3B8', textTransform: 'uppercase', marginBottom: 8 }}>
                        1 · User
                      </div>
                      <div style={{ font: '600 14px/20px Manrope', color: '#0F172A', marginBottom: 4 }}>
                        Dziś 24.04, 15:11 — klika "4/5"
                      </div>
                      <div style={{ font: '400 12px/18px Manrope', color: '#64748B' }}>
                        Tylko ocena + opcjonalna krótka notka. Nic więcej.
                      </div>
                    </div>
                    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#4F46E5', fontSize: 22, fontWeight: 300 }}>→</div>

                    {/* 2. App zamraża pogodę */}
                    <div style={{
                      padding: 16, borderRadius: 12,
                      background: 'linear-gradient(135deg, #EEF2FF 0%, #E0E7FF 100%)',
                      border: '1px solid rgba(79,70,229,.2)',
                    }}>
                      <div style={{ font: '600 10px/14px Manrope', letterSpacing: '1px', color: '#4F46E5', textTransform: 'uppercase', marginBottom: 8 }}>
                        2 · App zamraża snapshot
                      </div>
                      <div style={{
                        font: '500 11px/16px "JetBrains Mono", Menlo, monospace',
                        color: '#1E1B4B', background: 'rgba(255,255,255,.6)',
                        padding: 10, borderRadius: 8, whiteSpace: 'pre',
                      }}>
{`{
  date: "2026-04-24",
  rating: 4,
  note: "",
  weather: {
    temp: 18, feels: 15,
    cond: "partly",
    humidity: 62,
    wind: 12, pollen: "high"
  }
}`}
                      </div>
                    </div>
                    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#4F46E5', fontSize: 22, fontWeight: 300 }}>→</div>

                    {/* 3. Insighty */}
                    <div style={{
                      padding: 16, borderRadius: 12, background: '#F8FAFC',
                      border: '1px solid #E2E8F0',
                    }}>
                      <div style={{ font: '600 10px/14px Manrope', letterSpacing: '1px', color: '#94A3B8', textTransform: 'uppercase', marginBottom: 8 }}>
                        3 · Kalendarz + insighty
                      </div>
                      <div style={{ font: '400 12px/18px Manrope', color: '#64748B', marginBottom: 8 }}>
                        Po N ocenach agregujemy po warunku pogody:
                      </div>
                      <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
                        {[
                          { c: '☀️', l: 'słonecznie', v: '4.3/5' },
                          { c: '⛅', l: 'częściowe', v: '3.8/5' },
                          { c: '🌧', l: 'deszcz', v: '3.3/5' },
                        ].map(r => (
                          <div key={r.l} style={{ display: 'flex', gap: 8, font: '500 11px/16px Manrope', color: '#475569' }}>
                            <span>{r.c}</span>
                            <span style={{ flex: 1 }}>{r.l}</span>
                            <strong style={{ color: '#4F46E5' }}>{r.v}</strong>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>

                  {/* FAQ-style resolves */}
                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 14 }}>
                    <div style={{ padding: 14, borderRadius: 10, background: '#FEF3C7' }}>
                      <div style={{ font: '700 13px/18px Manrope', color: '#78350F', marginBottom: 4 }}>
                        A jeśli user oceni dzień wieczorem?
                      </div>
                      <div style={{ font: '400 12px/18px Manrope', color: '#78350F' }}>
                        Bierzemy snapshot z momentu zapisu (wieczorna pogoda). Opcjonalnie: liczymy średnią dzienną z tego co pobraliśmy w ciągu dnia — ale prostsze = lepsze, zaczynamy od "teraz".
                      </div>
                    </div>
                    <div style={{ padding: 14, borderRadius: 10, background: '#DCFCE7' }}>
                      <div style={{ font: '700 13px/18px Manrope', color: '#14532D', marginBottom: 4 }}>
                        Co ze starymi dniami?
                      </div>
                      <div style={{ font: '400 12px/18px Manrope', color: '#14532D' }}>
                        <strong>Forward-only.</strong> Nie pokazujemy historycznej pogody dla dni sprzed ocen — puste dni w kalendarzu zostają szare "brak oceny". Insighty budują się z czasem, im więcej ocen, tym ciekawsze korelacje.
                      </div>
                    </div>
                  </div>
                </div>
              </DCArtboard>
            </DCSection>

            <DCSection id="notes" title="Notatki">
              <DCArtboard id="notes-card" label="Co się zmieniło" width={1240} height={460}>
                <div style={{ padding: '32px 40px', background: '#fff', height: '100%', overflow: 'auto' }}>
                  <div style={{ font: '700 24px/30px Manrope', letterSpacing: '-.4px', marginBottom: 12 }}>
                    Iteracja: ocena dnia, nie AI-vibe'u
                  </div>
                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 18, marginBottom: 16 }}>
                    <div style={{ padding: 16, borderRadius: 12, background: '#F8FAFC', borderLeft: '3px solid #4F46E5' }}>
                      <div style={{ font: '700 13px/18px Manrope', color: '#4F46E5', marginBottom: 6 }}>Rating card</div>
                      <div style={{ font: '400 12px/18px Manrope', color: '#475569' }}>
                        Copy zmienione na "Jak oceniasz ten dzień?". Przed oceną: 3 warianty + link "Zobacz ostatnie oceny". Po ocenie: summary + <strong>Udostępnij poster</strong> + <strong>Zobacz Twój vibe</strong>. Trzecia opcja (pominięcie) to po prostu brak akcji — karta siedzi na Home, można wrócić później.
                      </div>
                    </div>
                    <div style={{ padding: 16, borderRadius: 12, background: '#F8FAFC', borderLeft: '3px solid #4F46E5' }}>
                      <div style={{ font: '700 13px/18px Manrope', color: '#4F46E5', marginBottom: 6 }}>Kalendarz "Twój vibe"</div>
                      <div style={{ font: '400 12px/18px Manrope', color: '#475569' }}>
                        Prev/next month, dziś = indigo obwódka, puste dni szare. Klik → detail card pod kalendarzem z: datą, pogodą, oceną, nazwą + krótka notka. Future dates disabled. Radar wycięty — ranking warunków + "ulubiona pogoda" zostają jako główne insighty.
                      </div>
                    </div>
                    <div style={{ padding: 16, borderRadius: 12, background: '#F8FAFC', borderLeft: '3px solid #4F46E5' }}>
                      <div style={{ font: '700 13px/18px Manrope', color: '#4F46E5', marginBottom: 6 }}>Wpięcie w Profil</div>
                      <div style={{ font: '400 12px/18px Manrope', color: '#475569' }}>
                        Pierwsza sekcja pod awatarem: <strong>TWÓJ VIBE</strong> z jedną pozycją "Twój vibe · Historia, kalendarz i ulubiona pogoda". Podświetlona kolorem akcentowym — traktujemy ją jako feature główny, nad nudną listą Email/Jednostki/Powiadomienia. Z Home wchodzimy bezpośrednio przez "Zobacz Twój vibe", z Profilu przez tę pozycję.
                      </div>
                    </div>
                  </div>
                  <div style={{ padding: 12, borderRadius: 10, background: '#FEF3C7', color: '#78350F', font: '500 13px/20px Manrope' }}>
                    <strong>Tweak "rated":</strong> przełącza wszystkie karty w stan po ocenie — zobaczysz wtedy share poster + CTA do Twój vibe w każdym wariancie.
                  </div>
                </div>
              </DCArtboard>
            </DCSection>
          </DesignCanvas>

          <TweaksPanel tweaks={tweaks} update={update}/>
        </>
      );
    }

    function TweaksPanel({ tweaks, update }) {
      const [open, setOpen] = useState(true);
      if (!open) {
        return (
          <button onClick={() => setOpen(true)} style={{
            position: 'fixed', bottom: 16, right: 16, zIndex: 1000,
            padding: '10px 14px', borderRadius: 999, border: 0, cursor: 'pointer',
            background: '#4F46E5', color: '#fff', font: '600 12px/16px Manrope',
            boxShadow: '0 6px 18px rgba(79,70,229,.35)',
          }}>Tweaks</button>
        );
      }
      const Seg = ({ k, opts }) => (
        <div style={{ display: 'flex', gap: 4, padding: 4, background: '#F1F5F9', borderRadius: 10, flexWrap: 'wrap' }}>
          {opts.map(o => (
            <button key={String(o.v)} onClick={() => update(k, o.v)} style={{
              flex: '1 0 30px', padding: '6px 8px', borderRadius: 6, border: 0, cursor: 'pointer',
              background: tweaks[k] === o.v ? '#fff' : 'transparent',
              font: `${tweaks[k] === o.v ? 600 : 500} 12px/16px Manrope`,
              color: tweaks[k] === o.v ? '#4F46E5' : '#475569',
              boxShadow: tweaks[k] === o.v ? '0 1px 2px rgba(15,23,42,.1)' : 'none',
            }}>{o.l}</button>
          ))}
        </div>
      );
      const Row = ({ label, children }) => (
        <div style={{ marginBottom: 12 }}>
          <div style={{
            font: '500 11px/16px Manrope', letterSpacing: '.4px',
            textTransform: 'uppercase', color: '#64748B', marginBottom: 6,
          }}>{label}</div>
          {children}
        </div>
      );
      return (
        <div style={{
          position: 'fixed', bottom: 16, right: 16, zIndex: 1000,
          width: 280, padding: 16, borderRadius: 14,
          background: '#fff', color: '#0F172A',
          boxShadow: '0 20px 60px rgba(15,23,42,.15), 0 0 0 1px rgba(15,23,42,.06)',
          font: '400 13px/18px Manrope',
        }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12 }}>
            <div style={{ font: '700 13px/18px Manrope', letterSpacing: '.4px', textTransform: 'uppercase' }}>Tweaks</div>
            <button onClick={() => setOpen(false)} style={{ border: 0, background: 'transparent', fontSize: 16, cursor: 'pointer', color: '#64748B' }}>×</button>
          </div>
          <Row label="Wariant">
            <Seg k="which" opts={[
              { v: 'all', l: 'Wszystkie' },
              { v: 'v1',  l: 'V1' },
              { v: 'v2',  l: 'V2' },
              { v: 'v3',  l: 'V3' },
            ]}/>
          </Row>
          <Row label="Stan karty">
            <Seg k="rated" opts={[
              { v: false, l: 'Nieocenione' },
              { v: true,  l: 'Po ocenie' },
            ]}/>
          </Row>
          <Row label="Twój vibe (kalendarz)">
            <Seg k="showHistory" opts={[
              { v: true,  l: 'Pokaż' },
              { v: false, l: 'Ukryj' },
            ]}/>
          </Row>
          <Row label="Profil">
            <Seg k="showProfile" opts={[
              { v: true,  l: 'Pokaż' },
              { v: false, l: 'Ukryj' },
            ]}/>
          </Row>
          <Row label="Język">
            <Seg k="lang" opts={[
              { v: 'pl', l: 'PL' },
              { v: 'en', l: 'EN' },
            ]}/>
          </Row>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
  </script>
</body>
</html>
