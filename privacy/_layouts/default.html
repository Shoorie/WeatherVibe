<!DOCTYPE html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    :root {
      --bg-start: #1B1E3D;
      --bg-end: #13142C;
      --accent-lavender: #8B82F6;
      --accent-indigo: #5B4FE5;
      --text-primary: #F1F5F9;
      --text-secondary: #A5A6CC;
      --text-tertiary: #6E709D;
      --glass-surface: rgba(255, 255, 255, 0.06);
      --glass-border: rgba(255, 255, 255, 0.12);
    }

    * { box-sizing: border-box; }

    html {
      background-color: var(--bg-end);
    }

    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(180deg, var(--bg-start) 0%, var(--bg-end) 100%) no-repeat;
      background-color: var(--bg-end);
      color: var(--text-primary);
      line-height: 1.65;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .content {
      max-width: 720px;
      margin: 0 auto;
      padding: 4rem 1.5rem 5rem;
    }

    .content > h1:first-child {
      margin-top: 0;
      font-size: 2.25rem;
      letter-spacing: -0.025em;
      background: linear-gradient(135deg, var(--text-primary), var(--accent-lavender));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    h1, h2, h3 {
      color: var(--text-primary);
      font-weight: 600;
      margin: 2.5rem 0 1rem;
      line-height: 1.3;
      letter-spacing: -0.015em;
    }

    h1 { font-size: 1.85rem; }

    h2 {
      font-size: 1.4rem;
      color: var(--accent-lavender);
      margin-top: 3rem;
    }

    h3 {
      font-size: 1.1rem;
      color: var(--text-secondary);
      font-weight: 500;
      margin-top: 2rem;
    }

    p {
      color: var(--text-primary);
      margin: 0 0 1rem;
    }

    ul {
      padding-left: 1.5rem;
      margin: 1rem 0;
    }

    li {
      color: var(--text-primary);
      margin-bottom: 0.5rem;
    }

    li::marker {
      color: var(--accent-lavender);
    }

    a {
      color: var(--accent-lavender);
      text-decoration: none;
      border-bottom: 1px solid rgba(139, 130, 246, 0.3);
      transition: color 0.15s, border-color 0.15s;
    }

    a:hover {
      color: #A29BFA;
      border-bottom-color: var(--accent-lavender);
    }

    code {
      background: var(--glass-surface);
      padding: 0.15em 0.45em;
      border-radius: 6px;
      border: 1px solid var(--glass-border);
      font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      font-size: 0.875em;
      color: var(--accent-lavender);
    }

    strong {
      color: var(--text-primary);
      font-weight: 600;
    }

    em { color: var(--text-secondary); }

    hr {
      border: none;
      height: 1px;
      background: var(--glass-border);
      margin: 3rem 0;
    }

    p:has(strong:first-child:only-child),
    p > strong:first-child:nth-last-child(2) {
      color: var(--text-secondary);
    }

    @media (max-width: 600px) {
      .content { padding: 2rem 1.25rem 3rem; }
      .content > h1:first-child { font-size: 1.85rem; }
      h1 { font-size: 1.5rem; }
      h2 { font-size: 1.2rem; }
    }
  </style>
</head>
<body>
  <main class="content">
    {{ content }}
  </main>
</body>
</html>
