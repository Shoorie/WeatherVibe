<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>WeatherVibe — Privacy Policy</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 480px;
      margin: 4rem auto;
      padding: 0 1.5rem;
      color: #1f2328;
      line-height: 1.5;
    }
    h1 { font-size: 1.5rem; }
    a {
      display: block;
      padding: 0.75rem 1rem;
      margin: 0.5rem 0;
      border: 1px solid #d0d7de;
      border-radius: 8px;
      text-decoration: none;
      color: #0969da;
    }
    a:hover { background: #f6f8fa; }
    footer {
      margin-top: 2rem;
      font-size: 0.875rem;
      color: #656d76;
    }
  </style>
  <script>
    (function () {
      var lang = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
      var target = lang.indexOf('pl') === 0
        ? 'privacy-policy-pl'
        : 'privacy-policy-en';
      window.location.replace(target);
    })();
  </script>
</head>
<body>
  <h1>WeatherVibe — Privacy Policy</h1>
  <p>Choose your language:</p>
  <a href="privacy-policy-en">🇬🇧 English version</a>
  <a href="privacy-policy-pl">🇵🇱 Polska wersja</a>
  <footer>Contact: weathervibe.support@gmail.com</footer>
</body>
</html>
